# The site name is defined once here. Reference it in pages with
# {{< meta site-title >}}; the website title below reuses it via the anchor.
site-title: &site-title "The Credibility Project"

# Starter list of allowed values for `categories:` in topic page front matter.
# Quarto does not enforce this list; it is the reference for authors.
topic-categories:
  - labor
  - taxes
  - housing
  - health
  - education
  - trade
  - immigration
  - environment
  - regulation
  - prices

project:
  type: website
  output-dir: _site
  # Render only published content. research/, README.md, and CLAUDE.md are
  # never rendered; the topic template is excluded explicitly.
  render:
    - index.qmd
    - about.qmd
    - topics/*.qmd
    - "!topics/_template.qmd"

website:
  title: *site-title
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: topics/index.qmd
        text: Topics
      - href: about.qmd
        text: About
  page-footer:
    center: "Summaries of the published research. Not advocacy. See [About](/about.qmd) for our methods."

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 2
    link-external-newwindow: true
