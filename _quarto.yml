project:
  type: website
  output-dir: _site
  pre-render: scripts/validate.R      # fails the build on missing required claim fields
  post-render: scripts/prune-drafts.R # removes draft claims' output, including their CSVs
  render:                             # whitelist: README, CLAUDE.md, docs/ and research/ never render
    - index.qmd
    - about.qmd
    - methods.qmd
    - topics/*.qmd
    - claims/index.qmd
    - claims/*/index.qmd
    - "!topics/_template.qmd"
    - "!claims/_template/"
  # Each claim's index.qmd declares its own CSVs under `resources:` so they download.

website:
  title: "The Credibility Project"
  description: "What the economic evidence says, and how sure we are."
  navbar:
    left:
      - text: Topics
        href: topics/index.qmd
      - text: Claims
        href: claims/index.qmd
      - text: Methods
        href: methods.qmd
      - text: About
        href: about.qmd
  page-footer:
    left: "The Credibility Project is nonpartisan and publishes its protocol, study tables, and reviewer conflicts of interest for every page."

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    code-fold: false
    echo: false

execute:
  freeze: auto
