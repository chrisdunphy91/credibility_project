name: Check site

# Runs validate.R and a full render on every pull request. Nothing is
# published or uploaded; the rendered output is discarded with the runner.
on:
  pull_request:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::yaml
            any::readr
            any::dplyr
            any::knitr
            any::rmarkdown

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.19

      - name: Render site (runs scripts/validate.R first)
        run: quarto render
